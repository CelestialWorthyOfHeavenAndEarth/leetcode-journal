<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#d2a8ff"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap');
    .label { font-family: 'Inter', sans-serif; font-size: 11px; fill: #8b949e; }
    .value { font-family: 'Inter', sans-serif; font-weight: 700; fill: #c9d1d9; }
    .title { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 18px; fill: #f0f6fc; }
    .subtitle { font-family: 'Inter', sans-serif; font-size: 12px; fill: #8b949e; }
    .float { animation: float 3s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }
  </style>

  <!-- Background -->
  <rect width="800" height="200" rx="12" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="798" height="198" rx="11" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- Top glow accent -->
  <rect width="800" height="80" rx="12" fill="url(#glowGrad)"/>

  <!-- Mascot area -->
  <g class="float">
    <!-- Body -->
    <circle cx="70" cy="100" r="30" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
    <!-- Inner ring -->
    <circle cx="70" cy="100" r="24" fill="none" stroke="#3fb950" stroke-width="0.5" opacity="0.4"/>
    <!-- Eyes -->
    <circle cx="60" cy="94" r="3" fill="#c9d1d9"><animate attributeName="ry" values="3;0.5;3" dur="4s" repeatCount="indefinite" keyTimes="0;0.48;0.52" keySplines="0.4 0 0.2 1;0.4 0 0.2 1" calcMode="spline"/></circle><circle cx="80" cy="94" r="3" fill="#c9d1d9"><animate attributeName="ry" values="3;0.5;3" dur="4s" repeatCount="indefinite" keyTimes="0;0.48;0.52" keySplines="0.4 0 0.2 1;0.4 0 0.2 1" calcMode="spline"/></circle>
    <!-- Mouth -->
    <path d="M64,104 Q70,110 76,104" fill="none" stroke="#c9d1d9" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Antenna -->
    <line x1="70" y1="70" x2="70" y2="58" stroke="#30363d" stroke-width="2"/>
    <circle cx="70" cy="55" r="4" fill="#3fb950" filter="url(#glow)" class="pulse"/>
  </g>

  <!-- Title block -->
  <text x="120" y="42" class="title">LeetCode Journal</text>
  <text x="120" y="60" class="subtitle">Automated DSA notes -- approach, complexity, insights</text>

  <!-- Divider -->
  <line x1="120" y1="72" x2="780" y2="72" stroke="#21262d" stroke-width="1"/>

  <!-- Stats row -->
  <text x="120" y="100" class="label">SOLVED</text>
  <text x="120" y="120" class="value" font-size="28">16</text>

  <text x="220" y="100" class="label">STATUS</text>
  <text x="220" y="118" class="value" font-size="14" fill="#3fb950">IN THE ZONE</text>

  <text x="380" y="100" class="label">ENGINE</text>
  <text x="380" y="118" class="value" font-size="13">Groq / Llama 3.3 70B</text>

  <text x="570" y="100" class="label">LANGUAGE</text>
  <text x="570" y="118" class="value" font-size="13">C++</text>

  <!-- Progress bar -->
  <text x="120" y="152" class="label">PROGRESS</text>
  <rect x="120" y="160" width="320" height="8" rx="4" fill="#21262d"/>
  <rect x="120" y="160" width="51" height="8" rx="4" fill="url(#barGrad)">
    <animate attributeName="width" from="0" to="51" dur="1.5s" fill="freeze"/>
  </rect>
  <text x="450" y="169" class="label">16/100</text>

  <!-- Bottom border accent -->
  <rect x="120" y="186" width="660" height="1" fill="#21262d"/>
  <rect x="120" y="186" width="160" height="1" fill="#3fb950" opacity="0.5"/>
</svg>