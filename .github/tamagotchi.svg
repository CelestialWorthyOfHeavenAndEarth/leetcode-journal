<svg width="780" height="200" viewBox="0 0 780 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .card-bg { fill: #ffffff; stroke: #e1e4e8; stroke-width: 1.5; rx: 12; }
    .title { font: 600 20px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #24292e; }
    .subtitle { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #586069; }
    .stat-lbl { font: 500 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #6a737d; text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-num { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #24292e; }
    .easy-num { fill: #00b8a3; }
    .med-num { fill: #ffc01e; }
    .hard-num { fill: #ff375f; }
    @media (prefers-color-scheme: dark) {
      .card-bg { fill: #0d1117; stroke: #30363d; }
      .title, .stat-num { fill: #c9d1d9; }
      .subtitle, .stat-lbl { fill: #8b949e; }
    }
  </style>

  <rect width="778" height="198" x="1" y="1" class="card-bg" />

  <!-- Header Section -->
  <g transform="translate(32, 36)">
    <text x="0" y="0" class="title">⬡ LeetCode Journal</text>
    <text x="0" y="20" class="subtitle">Continuous learning log &amp; algorithmic problem solving</text>
  </g>

  <!-- Progress Bar Breakdown -->
  <g transform="translate(32, 82)">
    <rect x="0" y="0" width="716" height="8" rx="4" fill="#eaecef" />
    <rect x="0" y="0" width="608.6" height="8" rx="4" fill="#00b8a3" />
    <rect x="608.6" y="0" width="107.4" height="8" fill="#ffc01e" />
    <rect x="716" y="0" width="0" height="8" rx="4" fill="#ff375f" />
  </g>

  <!-- Metric Counters -->
  <g transform="translate(32, 126)">
    <!-- Total -->
    <g transform="translate(0, 0)">
      <text x="0" y="0" class="stat-lbl">Total Solved</text>
      <text x="0" y="32" class="stat-num">20</text>
    </g>
    <!-- Easy -->
    <g transform="translate(190, 0)">
      <text x="0" y="0" class="stat-lbl">Easy</text>
      <text x="0" y="32" class="stat-num easy-num">17</text>
    </g>
    <!-- Medium -->
    <g transform="translate(370, 0)">
      <text x="0" y="0" class="stat-lbl">Medium</text>
      <text x="0" y="32" class="stat-num med-num">3</text>
    </g>
    <!-- Hard -->
    <g transform="translate(550, 0)">
      <text x="0" y="0" class="stat-lbl">Hard</text>
      <text x="0" y="32" class="stat-num hard-num">0</text>
    </g>
  </g>
</svg>