<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 250" width="550" height="250">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#7000ff"/>
      <stop offset="100%" stop-color="#ff007f"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="subtleGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap');
    .label { font-family: 'Space Mono', monospace; font-size: 11px; fill: #6b7280; text-transform: uppercase; letter-spacing: 2px; }
    .value { font-family: 'Space Mono', monospace; font-weight: 700; fill: #f3f4f6; }
    .title { font-family: 'Space Mono', monospace; font-weight: 700; font-size: 26px; fill: #ffffff; letter-spacing: 1px; }
    .subtitle { font-family: 'Space Mono', monospace; font-size: 11px; fill: #00f0ff; letter-spacing: 1px; }
    .pulse { animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 0.5; } 50% { opacity: 1; filter: drop-shadow(0 0 8px #ff007f); } }
  </style>

  <!-- Background -->
  <rect width="550" height="250" rx="12" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="548" height="248" rx="11" fill="none" stroke="#1f2937" stroke-width="2"/>
  
  <!-- Glowing accent borders -->
  <path d="M 0 12 Q 0 0 12 0 L 150 0" fill="none" stroke="#ff007f" stroke-width="3" filter="url(#glow)"/>
  <path d="M 550 238 Q 550 250 538 250 L 400 250" fill="none" stroke="#00f0ff" stroke-width="3" filter="url(#glow)"/>

  <!-- Title block -->
  <text x="40" y="60" class="title" filter="url(#subtleGlow)">NEURO_LINK//ACTIVE</text>
  <text x="40" y="80" class="subtitle">>>> CONNECTION_ESTABLISHED: LEETCODE</text>

  <!-- Divider -->
  <line x1="40" y1="100" x2="510" y2="100" stroke="#1f2937" stroke-width="2"/>

  <!-- Stats row -->
  <text x="40" y="135" class="label">PROBLEMS_SOLVED</text>
  <text x="40" y="165" class="value" font-size="32" fill="#fff" filter="url(#subtleGlow)">16</text>

  <text x="220" y="135" class="label">CURRENT_STATE</text>
  <!-- Animated pulse dot next to state -->
  <circle cx="225" cy="158" r="5" fill="#ff007f" class="pulse"/>
  <text x="240" y="163" class="value" font-size="16" fill="#ff007f">HACKING</text>

  <text x="400" y="135" class="label">AI_CORE</text>
  <text x="400" y="163" class="value" font-size="14" fill="#a855f7">Groq::Llama3</text>

  <!-- Progress bar -->
  <text x="40" y="205" class="label">OVERRIDE_CAPACITY</text>
  <rect x="40" y="215" width="340" height="8" rx="4" fill="#111827" stroke="#374151" stroke-width="1"/>
  <rect x="40" y="215" width="54" height="8" rx="4" fill="url(#barGrad)">
    <animate attributeName="width" from="0" to="54" dur="2s" fill="freeze"/>
  </rect>
  <text x="400" y="223" class="label">16.00%</text>
</svg>