<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="500" height="200">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
    .bg { fill: #0d0d0d; }
    .border { fill: none; stroke: #FF5500; stroke-width: 1; rx: 4; }
    .text-primary { fill: #FF5500; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; }
    .text-secondary { fill: #888888; font-family: 'JetBrains Mono', monospace; font-size: 10px; }
    .text-value { fill: #FFFFFF; font-family: 'JetBrains Mono', monospace; font-size: 24px; font-weight: 700; }
    .pixel { fill: #FF5500; }
    .pixel-dark { fill: #0d0d0d; }
    
    /* Animations */
    .float { animation: float 2s ease-in-out infinite alternate; }
    .blink { animation: blink 4s step-end infinite; }
    .walk { animation: walk 0.5s steps(2, end) infinite; }
    .glow { animation: pulse 2s ease-in-out infinite alternate; }

    @keyframes float { 0% { transform: translateY(0px); } 100% { transform: translateY(-4px); } }
    @keyframes blink { 0%, 95% { opacity: 1; } 96%, 100% { opacity: 0; } }
    @keyframes walk { 0% { transform: translateY(0px); } 50% { transform: translateY(-2px); } }
    @keyframes pulse { 0% { opacity: 0.5; } 100% { opacity: 1; } }
  </style>

  <!-- Terminal Window Background -->
  <rect width="500" height="200" rx="8" class="bg"/>
  <rect x="2" y="2" width="496" height="196" class="border"/>
  
  <!-- Top Bar -->
  <rect x="2" y="2" width="496" height="24" fill="#1a1a1a" rx="4"/>
  <circle cx="16" cy="14" r="4" fill="#FF5500"/>
  <circle cx="32" cy="14" r="4" fill="#888888"/>
  <circle cx="48" cy="14" r="4" fill="#888888"/>
  <text x="250" y="16" text-anchor="middle" class="text-secondary">agent_pet_v1.sh</text>

  <!-- Pet Container -->
  <g class="float" transform="translate(60, 70)">
    <!-- 16x16 Pixel Art Pet mapped to 80x80 (scale factor 5) -->
    <!-- Head/Body -->
    <path class="pixel" d="M25,10 h30 v10 h10 v30 h-10 v10 h-30 v-10 h-10 v-30 h10 z"/>
    <!-- Eyes -->
    <rect x="35" y="25" width="5" height="5" class="pixel-dark blink"/>
    <rect x="55" y="25" width="5" height="5" class="pixel-dark blink"/>
    <!-- Mouth -->
    <rect x="40" y="40" width="15" height="5" class="pixel-dark"/>
    <!-- Antenna -->
    <rect x="45" y="-10" width="5" height="20" class="pixel"/>
    <rect x="40" y="-15" width="15" height="5" class="pixel glow"/>
  </g>
  <g class="walk" transform="translate(60, 70)">
    <!-- Legs -->
    <rect x="30" y="60" width="10" height="10" class="pixel"/>
    <rect x="55" y="60" width="10" height="10" class="pixel"/>
  </g>

  <!-- Message Box -->
  <rect x="30" y="150" width="140" height="24" fill="#1a1a1a" rx="4"/>
  <text x="100" y="166" text-anchor="middle" class="text-primary">> Learning...</text>

  <!-- Divider -->
  <line x1="200" y1="40" x2="200" y2="180" stroke="#333333" stroke-width="1"/>

  <!-- Stats Dashboard -->
  <text x="230" y="60" class="text-secondary">SYSTEM.STATUS</text>
  <text x="230" y="80" class="text-primary">[ HAPPY ]</text>

  <text x="230" y="120" class="text-secondary">PROBLEMS.SOLVED</text>
  <text x="230" y="150" class="text-value">0016</text>

  <text x="380" y="60" class="text-secondary">AI.ENGINE</text>
  <text x="380" y="80" class="text-primary">GROQ/LLAMA-3.3</text>

  <text x="380" y="120" class="text-secondary">AESTHETIC</text>
  <text x="380" y="140" class="text-primary">CLAUDE_CODE</text>
</svg>